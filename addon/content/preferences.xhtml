<linkset>
  <html:link rel="localization" href="__addonRef__-preferences.ftl" />
</linkset>
<groupbox
  class="main-section"
  onload="Zotero.__addonInstance__.hooks.onPrefsEvent('load', { window });"
>
  <label
    control="zotero-prefpane-__addonRef__-color-container"
    data-l10n-id="pref-color"
  />
  <hbox align="center">
    <hbox id="zotero-prefpane-__addonRef__-color-container">
      <html:div
        class="color-box"
        data-color="rgba(255, 255, 0, 0.4)"
        style="background-color: rgba(255, 255, 0, 0.4)"
      ></html:div>
      <html:div
        class="color-box"
        data-color="rgba(144, 238, 144, 0.4)"
        style="background-color: rgba(144, 238, 144, 0.4)"
      ></html:div>
      <html:div
        class="color-box"
        data-color="rgba(173, 216, 230, 0.4)"
        style="background-color: rgba(173, 216, 230, 0.4)"
      ></html:div>
      <html:div
        class="color-box"
        data-color="rgba(255, 182, 193, 0.4)"
        style="background-color: rgba(255, 182, 193, 0.4)"
      ></html:div>
      <html:div
        class="color-box"
        data-color="rgba(221, 160, 221, 0.4)"
        style="background-color: rgba(221, 160, 221, 0.4)"
      ></html:div>
    </hbox>
  </hbox>
</groupbox>
<html:hr class="pref-hr" />
<vbox>
  <html:label
    data-l10n-id="pref-help"
    data-l10n-args='{"time": "__buildTime__","name": "__addonName__","version":"__buildVersion__"}'
  ></html:label>
</vbox>
